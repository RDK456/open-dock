# Builds Windows, macOS and Android from a version tag into one draft GitHub release.
# Publishing the draft makes it releases/latest, which is what installed apps check.
# Release: node scripts/bump-version.ts 1.2.0, commit, then git tag v1.2.0 && git push origin v1.2.0
# Secrets come from scripts/setup-release-signing.sh.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/bump-version.ts --check "$GITHUB_REF_NAME"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Open Dock $GITHUB_REF_NAME" --generate-notes
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest # Apple silicon
            target: aarch64-apple-darwin
            macos_config: --config src-tauri/tauri.macos-release.conf.json
          - os: macos-latest # Intel, cross-compiled
            target: x86_64-apple-darwin
            macos_config: --config src-tauri/tauri.macos-release.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
        working-directory: pc-companion
      # Reads now playing on macOS; bundled through tauri.macos-release.conf.json.
      - name: Build the now playing adapter
        if: runner.os == 'macOS'
        run: bash scripts/build-mediaremote-adapter.sh
      # Tauri's own APPLE_CERTIFICATE import only accepts Apple-issued certificates, so the
      # self-signed one goes into a keychain here and Tauri signs with it by name.
      - name: Import the self-signed signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # codesign only uses a self-signed identity the system trusts for code signing.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin env:APPLE_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && 'Open Dock Self-Signed' || '' }}
        with:
          projectPath: pc-companion
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json ${{ matrix.macos_config }}

  android:
    needs: draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17 # React Native recommends 17 and warns newer JDKs can break the build
      # Caches Gradle; unlike setup-java's cache it doesn't need android/ to exist yet.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Real phones only; skipping the x86 emulator ABIs keeps the APK smaller.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: phone-app/android
      # Prebuild signs release builds with the debug key, so re-sign with the release key.
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias opendock \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out OpenDock.apk android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs OpenDock.apk
          rm "$RUNNER_TEMP/release.p12"
      - run: gh release upload "$GITHUB_REF_NAME" OpenDock.apk
        env:
          GH_TOKEN: ${{ github.token }}
