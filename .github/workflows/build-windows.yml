name: Build Windows PC Companion

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
        working-directory: pc-companion

      - name: Build frontend
        run: npm run build
        working-directory: pc-companion

      - name: Build PC companion executable
        run: cargo build --release
        working-directory: pc-companion/src-tauri

      - name: Build NSIS installer (optional)
        run: npx tauri build
        working-directory: pc-companion
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-dock-amd-build
          path: |
            pc-companion/src-tauri/target/release/open-dock-pc.exe
            pc-companion/src-tauri/target/release/bundle/nsis/*.exe
