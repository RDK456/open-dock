<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Picks the theme before the first paint, so a light or dark start never flashes the other. theme.tsx keeps it after.
      (function () {
        var light = false;
        try {
          var saved = localStorage.getItem("opendock.appearance");
          light = saved === "light" || (saved !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
          // Every look comes in light and dark (theme.tsx).
          var look = localStorage.getItem("opendock.look");
          look = { console: "signal", bento: "studio", desk: "atelier" }[look] || look;
          if (/^(studio|atelier|signal|glass|funk)$/.test(look)) document.documentElement.setAttribute("data-look", look);
        } catch (e) {
          try { light = window.matchMedia("(prefers-color-scheme: light)").matches; } catch (e2) { /* dark */ }
        }
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
    <style>
      html[data-theme="light"] { background: #ffffff; color-scheme: light; }
      html[data-theme="dark"] { background: #09090b; color-scheme: dark; }
    </style>
    <title>Open Dock</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
