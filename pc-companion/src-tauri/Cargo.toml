[package]
name = "open-dock-pc"
version = "0.0.1"
description = "Local PC companion for Open Dock"
authors = ["Open Dock"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_dock_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api lets the macOS window be transparent, so the native sidebar material shows.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
axum = { version = "0.8", features = ["ws"] }
enigo = "0.6"
local-ip-address = "0.6"
rand = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tauri-plugin-dialog = "2.8.0"
sysinfo = "0.39.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# A second launch focuses the running window instead of starting another process.
tauri-plugin-single-instance = "2"
# Downloads Google's platform-tools (adb) when the PC has none; same rustls stack as the updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# Delta updates (src/delta.rs): the patch's zlib blocks and the updater plugin's signature check.
flate2 = "1"
minisign-verify = "0.2"
zip = { version = "4", default-features = false, features = ["deflate"] }
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_SpeechRecognition", "Win32_System_Registry", "Media_Control", "Storage_Streams", "Wdk_Graphics_Direct3D", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Dxgi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# GPU vendor libraries (NVML, AMD ADLX/ADL, Intel IGCL) are loaded at runtime; none is required.
nvml-wrapper = "0.13.0"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
