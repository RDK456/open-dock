plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.opendock'
version = '1.0.0'

android {
  namespace "app.opendock.opencam"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Background blur: on-device person mask, model bundled (no download, works offline).
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
